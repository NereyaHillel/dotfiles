# =============================================================================
# Core Keybindings
# =============================================================================
unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-a

# Move status bar to the top
set -g status-position top

# =============================================================================
# Global Terminal & SSH Canvas Colors (Gruvbox Dark)
# =============================================================================
# Enable 24-bit True Color support so hex codes render correctly
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Force pane backgrounds to Gruvbox Dark and text to Gruvbox White
set -g window-style 'bg=#1d2021,fg=#ebdbb2'
set -g window-active-style 'bg=#1d2021,fg=#ebdbb2'

# Style the pane divider borders to blend into the theme
set -g pane-border-style 'bg=#1d2021,fg=#3c3836'
set -g pane-active-border-style 'bg=#1d2021,fg=#b8bb26'

# =============================================================================
# Plugins & Status Bar (Gruvbox)
# =============================================================================
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'egel/tmux-gruvbox'

# Set tmux-gruvbox theme variant
set -g @tmux-gruvbox 'dark'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
